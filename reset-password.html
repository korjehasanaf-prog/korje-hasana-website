<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নতুন পাসওয়ার্ড | কর্জে হাসানা ফাউন্ডেশন</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="_supabase.js"></script>
  <style>
    :root{ --pink:#d6336c; --orange:#e95420; --violet:#7048e8; --ink:#241539; --muted:#6b6280; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Hind Siliguri','Inter',sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:26px 16px; position:relative; overflow-x:hidden; color:#f3edfb;
      background:#150c24;
    }
    /* ক্যালিগ্রাফি ব্যাকগ্রাউন্ড — দুই থীমেই মূল ছবি */
    .bg{position:fixed;inset:0;z-index:0;pointer-events:none;
        background:url('images/auth-bg.jpg') center/cover no-repeat}
    @media(max-width:640px){ .bg{background:url('images/auth-bg-mobile.jpg') center/cover no-repeat} }

    .card{
      position:relative; z-index:1; width:100%; max-width:400px;
      background:rgba(26,14,45,.9);
      border:1px solid rgba(255,255,255,.17);
      border-radius:24px; padding:30px 26px;
      backdrop-filter:blur(22px) saturate(155%);
      box-shadow:0 24px 70px rgba(0,0,0,.5);
    }
    html[data-theme="light"] .card{
      background:rgba(255,255,255,.95); border-color:#ece2f4; color:var(--ink);
      box-shadow:0 24px 70px rgba(112,72,232,.28);
    }

    .ico{
      width:66px;height:66px;border-radius:50%;margin:0 auto 14px;
      display:flex;align-items:center;justify-content:center;font-size:29px;color:#fff;
      background:linear-gradient(135deg,var(--pink),var(--violet));
      box-shadow:0 8px 24px rgba(160,33,201,.4);
    }
    h1{font-size:22px;text-align:center;margin-bottom:5px}
    .sub{font-size:13.5px;text-align:center;color:#cbbfdd;margin-bottom:22px;line-height:1.7}
    html[data-theme="light"] .sub{color:var(--muted)}

    .fg{margin-bottom:15px;position:relative}
    .fg label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:#dccfec}
    html[data-theme="light"] .fg label{color:#4a3568}
    .fg input{
      width:100%;padding:13px 42px 13px 14px;border-radius:12px;font-family:inherit;font-size:15px;
      border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    .fg input:focus{border-color:#c88ae0;box-shadow:0 0 0 3px rgba(160,33,201,.2)}
    html[data-theme="light"] .fg input{background:#faf7fd;border-color:#e3d8ee;color:var(--ink)}
    html[data-theme="light"] .fg input:focus{background:#fff;border-color:#a021c9}

    .btn{
      width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;margin-top:4px;
      background:linear-gradient(112deg,var(--pink),#a021c9 48%,#e83e8c);
      color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;
      box-shadow:0 8px 24px rgba(160,33,201,.4);
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn:hover{filter:brightness(1.08)}
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .msg{display:none;padding:11px 14px;border-radius:11px;font-size:13.5px;margin-bottom:16px;line-height:1.65}
    .msg.err{display:block;background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.4);color:#fecaca}
    .msg.ok{display:block;background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.4);color:#bbf7d0}
    .msg.info{display:block;background:rgba(240,140,40,.16);border:1px solid rgba(240,140,40,.4);color:#fde68a}
    html[data-theme="light"] .msg.err{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
    html[data-theme="light"] .msg.ok{background:#dcfce7;border-color:#86efac;color:#14532d}
    html[data-theme="light"] .msg.info{background:#fff4e6;border-color:#fcd9a0;color:#92400e}

    .alt{text-align:center;margin-top:18px;font-size:13.5px;color:#cbbfdd}
    html[data-theme="light"] .alt{color:var(--muted)}
    .alt a{color:#e083b4;text-decoration:none;font-weight:600;cursor:pointer}
    html[data-theme="light"] .alt a{color:#b02a80}

    .gate{text-align:center;padding:14px 0}
    .gate .sp{font-size:34px;color:#c88ae0;animation:sp 1s linear infinite;display:inline-block}
    @keyframes sp{to{transform:rotate(360deg)}}
    .spin{animation:sp .9s linear infinite;display:inline-block}
  </style>
</head>
<body data-kh-nav="off">

<div class="bg"></div>

<div class="card">
  <div class="ico"><i class="ti ti-lock-open"></i></div>
  <h1>নতুন পাসওয়ার্ড দিন</h1>
  <div class="sub" id="who">লিংক যাচাই করা হচ্ছে…</div>

  <div class="msg" id="msg"></div>

  <div class="gate" id="gate"><i class="ti ti-loader-2 sp"></i></div>

  <div id="form" style="display:none">
    <div class="fg">
      <label for="p1">নতুন পাসওয়ার্ড</label>
      <input type="password" id="p1" data-kh-strength="1" autocomplete="new-password" placeholder="কমপক্ষে ৬ অক্ষর">
    </div>
    <div class="fg">
      <label for="p2">আবার লিখুন</label>
      <input type="password" id="p2" autocomplete="new-password" placeholder="একই পাসওয়ার্ড">
    </div>
    <button class="btn" id="saveBtn" type="button"><i class="ti ti-device-floppy"></i> পাসওয়ার্ড সংরক্ষণ করুন</button>
  </div>

  <div class="alt"><a href="user-login.html">লগইন পেজে ফিরে যান</a></div>
</div>

<link rel="stylesheet" href="kh-ui.css?v=5">
<script src="kh-ui.js?v=5"></script>
<script>
(function () {
  'use strict';

  function sb(){
    if (window._db) return window._db;
    try { if (typeof _db !== 'undefined' && _db) { window._db = _db; return _db; } } catch (e) {}
    return null;
  }
  function el(id){ return document.getElementById(id); }
  function msg(kind, text){
    var m = el('msg');
    if(!text){ m.className='msg'; m.textContent=''; return; }
    m.className = 'msg ' + kind; m.textContent = text;
  }

  /* URL-এর hash বা query থেকে রিকভারি টোকেন নেওয়া
     (_supabase.js-এ detectSessionInUrl বন্ধ, তাই নিজেই সামলাই) */
  function paramsFromUrl(){
    var out = {};
    var h = location.hash ? location.hash.substring(1) : '';
    var q = location.search ? location.search.substring(1) : '';
    [h, q].forEach(function (str) {
      if (!str) return;
      str.split('&').forEach(function (p) {
        var i = p.indexOf('=');
        if (i > 0) out[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1).replace(/\+/g, ' '));
      });
    });
    return out;
  }

  function cleanUrl(){
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }

  async function boot(){
    var db = sb();
    if (!db) { el('gate').style.display='none'; msg('err','সংযোগ তৈরি হয়নি। পেজটি রিফ্রেশ করুন।'); return; }

    var p = paramsFromUrl();

    /* লিংকে সমস্যা থাকলে সরাসরি জানানো */
    if (p.error || p.error_code) {
      el('gate').style.display='none';
      el('who').textContent = '';
      var exp = /expired|invalid/i.test(p.error_code || p.error_description || p.error || '');
      msg('err', exp
        ? 'লিংকটির মেয়াদ শেষ বা এটি আগেই ব্যবহার হয়েছে। লগইন পেজে গিয়ে আবার "পাসওয়ার্ড ভুলে গেছেন?" চাপুন।'
        : ('লিংকে সমস্যা: ' + (p.error_description || p.error)));
      cleanUrl();
      return;
    }

    /* ধাপ ১ — টোকেন থেকে সাময়িক সেশন */
    try {
      if (p.access_token && p.refresh_token) {
        await db.auth.setSession({ access_token: p.access_token, refresh_token: p.refresh_token });
        cleanUrl();
      } else if (p.code && db.auth.exchangeCodeForSession) {
        await db.auth.exchangeCodeForSession(p.code);
        cleanUrl();
      }
    } catch (e) { /* নিচে সেশন যাচাই হবে */ }

    /* ধাপ ২ — সেশন আছে কি (কোড-পথে user-login থেকে এলে আগেই থাকে) */
    var s = null;
    try { s = await db.auth.getSession(); } catch (e) {}
    var sess = s && s.data && s.data.session;

    el('gate').style.display = 'none';

    if (!sess) {
      el('who').textContent = '';
      msg('err', 'পাসওয়ার্ড বদলানোর অনুমতি পাওয়া যায়নি। লগইন পেজে গিয়ে "পাসওয়ার্ড ভুলে গেছেন?" চেপে নতুন কোড বা লিংক নিন।');
      return;
    }

    var mail = sess.user && sess.user.email ? sess.user.email : '';
    el('who').innerHTML = mail
      ? ('অ্যাকাউন্ট: <b>' + mail.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</b><br>নতুন পাসওয়ার্ডটি দিন — এরপর এটি দিয়েই লগইন করবেন।')
      : 'নতুন পাসওয়ার্ডটি দিন — এরপর এটি দিয়েই লগইন করবেন।';
    el('form').style.display = '';
    setTimeout(function(){ el('p1').focus(); }, 60);

    el('p2').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('saveBtn').click(); });

    el('saveBtn').onclick = async function () {
      var b = this;
      var a = el('p1').value, c = el('p2').value;
      msg('');

      if (!a) { msg('err','নতুন পাসওয়ার্ড লিখুন।'); el('p1').focus(); return; }
      if (a.length < 6) { msg('err','পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।'); el('p1').focus(); return; }
      if (a !== c) { msg('err','দুটি পাসওয়ার্ড মিলছে না।'); el('p2').focus(); return; }
      if (window.KHUI && KHUI.score && KHUI.score(a) <= 1) {
        msg('err','পাসওয়ার্ডটি খুব দুর্বল। বড় হাতের অক্ষর, সংখ্যা ও চিহ্ন যোগ করুন।'); el('p1').focus(); return;
      }

      b.disabled = true;
      b.innerHTML = '<i class="ti ti-loader-2 spin"></i> সংরক্ষণ হচ্ছে…';
      try {
        var r = await db.auth.updateUser({ password: a });
        if (r && r.error) throw r.error;
        el('form').style.display = 'none';
        msg('ok','পাসওয়ার্ড বদলানো হয়েছে! এখন নতুন পাসওয়ার্ড দিয়ে লগইন করুন।');
        try { sessionStorage.clear(); } catch (e) {}
        setTimeout(function () { location.href = 'user-login.html?stay=1'; }, 1800);
      } catch (e) {
        var t = (e && e.message) || '';
        msg('err', /should be different|same/i.test(t)
          ? 'নতুন পাসওয়ার্ডটি আগেরটির মতোই — অন্য একটি দিন।'
          : ('সংরক্ষণ ব্যর্থ: ' + (t || 'আবার চেষ্টা করুন')));
        b.disabled = false;
        b.innerHTML = '<i class="ti ti-device-floppy"></i> পাসওয়ার্ড সংরক্ষণ করুন';
      }
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>

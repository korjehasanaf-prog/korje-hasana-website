<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্টেটমেন্ট যাচাই | কর্জে হাসানা ফাউন্ডেশন</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="_supabase.js"></script>
  <link rel="stylesheet" href="kh-ui.css?v=65">
<link rel="stylesheet" href="kh-app-downloads.css?v=66">
  <style>
    .sv-wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 60px; }
    .sv-card { background: var(--paper-lit, #fff); border: 1px solid var(--kh-line, #ece7f0); border-radius: 16px; padding: 22px; color: var(--kh-ink, #241539); }
    .sv-title { font-size: 22px; font-weight: 800; display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .sv-sub { font-size: 14px; color: var(--kh-mute, #5f5570); line-height: 1.7; margin-bottom: 16px; }
    .sv-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .sv-input { flex: 1; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--kh-line, #ece7f0); padding: 0 14px; font: inherit; font-size: 16px; background: transparent; color: inherit; text-transform: uppercase; }
    .sv-btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0; background: #7048e8; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .sv-ok { border-color: #6ee7b7; background: #d1fae5; color: #065f46; border-radius: 12px; padding: 14px; font-weight: 600; }
    .sv-bad { border-color: #fca5a5; background: #fee2e2; color: #991b1b; border-radius: 12px; padding: 14px; font-weight: 600; }
    .sv-dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; font-size: 14px; }
    .sv-dl div span { display: block; font-size: 12px; color: var(--kh-mute, #5f5570); }
    .sv-note { font-size: 12.5px; color: var(--kh-mute, #5f5570); margin-top: 14px; line-height: 1.6; }
  </style>
</head>
<body data-kh-nav="on">
<main class="sv-wrap">
  <div class="sv-card">
    <h1 class="sv-title"><i class="ti ti-shield-check"></i> স্টেটমেন্ট যাচাই</h1>
    <p class="sv-sub">স্টেটমেন্টের উপরের QR কোড স্ক্যান করলে এই পাতা খুলবে। অথবা স্টেটমেন্টে ছাপা "যাচাই" কোডটি নিচে লিখুন।</p>
    <form class="sv-row" id="svForm" onsubmit="svCheck(event)">
      <input class="sv-input" id="svRef" name="ref" placeholder="STM-XXXXXX-XXXXXXXXXX" autocomplete="off" aria-label="যাচাই কোড">
      <button class="sv-btn" type="submit">যাচাই</button>
    </form>
    <div id="svResult" aria-live="polite"></div>
    <p class="sv-note">এই পাতায় শুধু স্টেটমেন্টের বৈধতা, সময়কাল, সমাপনী স্থিতি ও নামের প্রথম অক্ষর দেখানো হয়। কোনো ব্যক্তিগত নথি বা হিসাব নম্বর এখানে প্রকাশ হয় না।</p>
  </div>
</main>
<script>
function svEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function svTaka(n) { return '৳' + (parseFloat(n || 0) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
function svDate(d) { return d ? new Date(d).toLocaleDateString('bn-BD', { timeZone: 'Asia/Dhaka', day: 'numeric', month: 'long', year: 'numeric' }) : '—'; }

async function svLookup(ref) {
  var out = document.getElementById('svResult');
  ref = String(ref || '').trim().toUpperCase();
  if (!ref) { out.innerHTML = ''; return; }
  out.innerHTML = '<div class="sv-sub" style="margin-top:14px">যাচাই হচ্ছে…</div>';
  var r = await _db.rpc('verify_statement', { p_ref: ref });
  if (r.error) { out.innerHTML = '<div class="sv-bad">যাচাই করা যায়নি। আবার চেষ্টা করুন।</div>'; return; }
  var d = r.data || {};
  if (!d.ok) { out.innerHTML = '<div class="sv-bad">' + svEsc(d.error || 'এই কোড কোনো স্টেটমেন্টের সাথে মেলে না।') + '</div>'; return; }
  out.innerHTML = '<div class="sv-ok"><i class="ti ti-circle-check"></i> এই স্টেটমেন্টটি সিস্টেম থেকে তৈরি ও বৈধ।</div>' +
    '<div class="sv-dl">' +
      '<div><span>যাচাই কোড</span>' + svEsc(d.ref) + '</div>' +
      '<div><span>প্রস্তুতের তারিখ</span>' + svEsc(svDate(d.issued_at)) + '</div>' +
      '<div><span>সময়কাল</span>' + svEsc(svDate(d.period_from)) + ' — ' + svEsc(svDate(d.period_to)) + '</div>' +
      '<div><span>সমাপনী স্থিতি</span>' + svEsc(svTaka(d.closing_balance)) + '</div>' +
      '<div><span>সদস্য</span>' + svEsc(d.holder) + '</div>' +
    '</div>';
}

function svCheck(e) { e.preventDefault(); svLookup(document.getElementById('svRef').value); }

document.addEventListener('DOMContentLoaded', function () {
  var q = new URLSearchParams(location.search).get('ref');
  if (q) { document.getElementById('svRef').value = q; svLookup(q); }
});
</script>
<script src="kh-ui.js?v=66"></script>
<script src="kh-app-downloads.js?v=66" defer></script>
</body>
</html>

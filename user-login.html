<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন | কর্জে হাসানা ফাউন্ডেশন</title>
  <meta name="description" content="কর্জে হাসানা ফাউন্ডেশনের সদস্য পোর্টালে লগইন করুন — আমানতকারী, ঋণগ্রহীতা ও দাতা সদস্যদের জন্য।">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="_supabase.js"></script>
  <style>
    :root{
      --pink:#d6336c; --orange:#e95420; --amber:#f08c28; --violet:#7048e8;
      --ink:#241539; --muted:#6b6280;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Hind Siliguri','Inter',sans-serif;
      background:#150c24; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      padding:28px 16px; position:relative; overflow-x:hidden;
    }

    /* ── ইসলামিক ক্যালিগ্রাফি ব্যাকগ্রাউন্ড — দুই থীমেই মূল ছবি হুবহু, কোনো ওভারলে নেই ── */
    .bg{
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background:url('images/auth-bg.jpg') center/cover no-repeat;
    }

    /* orbs বন্ধ — ছবি যেন ঝাপসা না হয় */
    .orb{display:none}
    @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(36px,-28px) scale(1.09)}66%{transform:translate(-28px,24px) scale(.95)}}

    /* ── cursor-following spotlight ── */
    .spot{
      position:fixed;width:640px;height:640px;left:0;top:0;margin:-320px 0 0 -320px;
      border-radius:50%;pointer-events:none;z-index:0;opacity:0;
      background:radial-gradient(circle,rgba(232,62,140,.6) 0%,rgba(196,58,180,.34) 32%,rgba(120,60,220,.13) 58%,transparent 74%);
      filter:blur(48px);transition:opacity .5s;will-change:transform;
    }
    .spot.lit{opacity:1}

    /* ── flip scene ── */
    .scene{position:relative;z-index:1;width:380px;max-width:100%;perspective:1600px}
    /* the cursor tilt lives on its own layer so it can never interrupt
       the flip — two elements, two independent transforms */
    .tilt{position:relative;width:100%;transform-style:preserve-3d;
      transition:transform .3s ease-out;will-change:transform}
    /* height is set by JS to match the visible face; these are no-JS fallbacks */
    .flip{position:relative;width:100%;min-height:600px;transform-style:preserve-3d;
      transition:transform .95s cubic-bezier(.68,-.05,.3,1.05),height .55s cubic-bezier(.4,0,.2,1);will-change:transform}
    .flip.reg{min-height:822px}
    /* top/left/right only — no `bottom`, so each face keeps its own
       natural height and JS can size the flip container to match */
    .face{
      position:absolute;top:0;left:0;right:0;
      backface-visibility:hidden;-webkit-backface-visibility:hidden;
      /* উজ্জ্বল ছবির ওপরে পাঠযোগ্যতার জন্য ডার্ক থীমে কার্ড গাঢ় */
      background:rgba(26,14,45,.88);
      backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%);
      border:1px solid rgba(255,255,255,.17);border-radius:24px;
      padding:26px 24px;box-shadow:0 24px 70px rgba(0,0,0,.46)
    }
    .back{transform:rotateY(180deg)}
    .face::before{content:'';position:absolute;inset:0;border-radius:24px;pointer-events:none;opacity:.5;
      background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.13),transparent 60%)}
    .face > *{position:relative;z-index:1}

    /* ── animated eyes ── */
    .head{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.18);margin:0 auto 13px;display:flex;
      align-items:center;justify-content:center;gap:12px}
    .eye{width:15px;height:15px;border-radius:50%;background:#fff;position:relative;transition:height .14s}
    .pup{position:absolute;width:6px;height:6px;border-radius:50%;background:#241539;
      top:50%;left:50%;margin:-3px 0 0 -3px;transition:transform .09s ease-out}
    .head.shut .eye{height:2.5px}
    .head.shut .pup{opacity:0}

    .h1{text-align:center;color:#fff;font-size:25px;font-weight:700;margin-bottom:4px;line-height:1.4}
    .sub{text-align:center;color:rgba(255,255,255,.8);font-size:14px;margin-bottom:18px;line-height:1.6}

    /* ── role chips ── */
    .sect{font-size:13px;font-weight:700;color:#f3d5ff;
      margin:2px 0 12px;display:flex;align-items:center;gap:8px;line-height:1.6}
    .sect::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.22)}
    .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:15px}
    .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:20px;
      padding:8px 14px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:#fff;
      display:flex;align-items:center;gap:6px;transition:all .25s;line-height:1.5}
    .chip i{font-size:14.5px;color:#fff}
    .chip .tick{display:none}
    .chip.on{background:linear-gradient(135deg,#e83e8c,#7048e8);border-color:rgba(255,255,255,.55);
      box-shadow:0 5px 18px rgba(232,62,140,.5)}
    .chip.on .tick{display:inline}
    .chip.on .ico{display:none}

    /* ── fields ── */
    .fg{position:relative;margin-bottom:14px}
    .fg input{width:100%;padding:13px 42px 13px 40px;border-radius:12px;
      border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.07);color:#fff;
      font-family:inherit;font-size:15.5px;outline:none;transition:border-color .25s,box-shadow .25s}
    .fg input::placeholder{color:transparent}
    .fg input:focus{border-color:#c084fc;box-shadow:0 0 0 3px rgba(192,132,252,.22)}
    .fg .li{position:absolute;left:14px;top:50%;transform:translateY(-50%);
      color:rgba(255,255,255,.55);font-size:16px;pointer-events:none;transition:color .25s}
    .fg input:focus~.li{color:#e9d5ff}
    .fg label{position:absolute;left:38px;top:50%;transform:translateY(-50%);font-size:15px;
      color:rgba(255,255,255,.72);pointer-events:none;padding:0 5px;white-space:nowrap;
      transition:all .24s cubic-bezier(.34,1.4,.5,1)}
    .fg input:focus+label,.fg input:not(:placeholder-shown)+label{
      top:-2px;left:12px;font-size:12.5px;font-weight:600;color:#fff;line-height:1.5;
      background:linear-gradient(100deg,#9c2472,#5b34c4);border-radius:7px;transform:none;
      padding:2px 9px;box-shadow:0 2px 10px rgba(0,0,0,.45)}
    .eb{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;
      color:rgba(255,255,255,.55);cursor:pointer;font-size:17px;padding:3px}
    .eb:hover{color:#e9d5ff}

    .ut{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px;font-size:13.5px}
    .ut label{color:rgba(255,255,255,.88);display:flex;align-items:center;gap:6px;cursor:pointer}
    .ut input{accent-color:#e83e8c;width:13px;height:13px}
    .ut a{color:#f0abfc;text-decoration:none;font-weight:600;cursor:pointer}

    .btn{width:100%;padding:13.5px;border:none;border-radius:12px;
      background:linear-gradient(112deg,#7048e8,#a021c9 48%,#e83e8c);color:#fff;
      font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;
      box-shadow:0 8px 26px rgba(160,33,201,.5);transition:transform .15s,filter .25s;
      display:flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover{filter:brightness(1.12)}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .or{display:flex;align-items:center;gap:9px;margin:15px 0;color:rgba(255,255,255,.65);font-size:12.5px}
    .or::before,.or::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.15)}
    .guest{width:100%;padding:11px;border-radius:12px;border:1px dashed rgba(255,255,255,.32);
      background:rgba(255,255,255,.05);color:#fff;font-family:inherit;font-size:14.5px;font-weight:600;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .25s}
    .guest:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.5)}

    .alt{text-align:center;color:rgba(255,255,255,.85);font-size:14px;margin-top:15px;line-height:1.6}
    .alt a{color:#f0abfc;font-weight:700;text-decoration:none;cursor:pointer}
    .alt a:hover{text-decoration:underline}

    .pwbar{height:4px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin:-8px 0 12px}
    .pwfill{height:100%;width:0;border-radius:99px;background:#ef4444;transition:width .4s,background .35s}

    .msg{display:none;padding:10px 13px;border-radius:9px;font-size:13.5px;margin-bottom:14px;line-height:1.65}
    .msg.err{display:block;background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.4);color:#fecaca}
    .msg.ok{display:block;background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.4);color:#bbf7d0}
    .msg.info{display:block;background:rgba(240,140,40,.16);border:1px solid rgba(240,140,40,.4);color:#fde68a}

    .shake{animation:shk .45s}
    @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

    .caps{display:none;font-size:12.5px;color:#fde68a;margin:-9px 0 12px;align-items:center;gap:5px}
    .caps.on{display:flex}

    .home{position:fixed;top:18px;left:18px;z-index:2;color:rgba(255,255,255,.7);
      text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
      padding:9px 15px;border-radius:20px;transition:all .25s;font-family:inherit}
    .home:hover{background:rgba(255,255,255,.16);color:#fff}

    .spin{animation:sp .9s linear infinite;display:inline-block}
    @keyframes sp{to{transform:rotate(360deg)}}

    @media(max-width:640px){
      .orb,.spot{display:none}
      /* মোবাইলে পোর্ট্রেট ক্যালিগ্রাফি ভার্সন — দুই থীমেই মূল ছবি */
      .bg{background:url('images/auth-bg-mobile.jpg') center/cover no-repeat}
      body{background:linear-gradient(160deg,#2a1040,#150c24 55%,#3a1236);
           flex-direction:column;justify-content:flex-start;padding:16px 12px 28px}
      .home{position:static;margin-bottom:14px;align-self:flex-start}
      .face{padding:22px 18px}
      .flip{min-height:620px}
      .flip.reg{min-height:856px}
      .chip{font-size:13px;padding:8px 12px}
      .fg input{font-size:16px}       /* 16px stops iOS from zooming on focus */
    }
  </style>
</head>
<body data-kh-nav="off">

<div class="bg"></div>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="spot" id="spot"></div>

<a href="index.html" class="home"><i class="ti ti-arrow-left"></i> হোমপেজ</a>

<div class="scene">
 <div class="tilt" id="tilt">
  <div class="flip" id="flip">

    <!-- ════════ LOGIN ════════ -->
    <div class="face front">
      <div class="head" id="hA"><div class="eye"><span class="pup"></span></div><div class="eye"><span class="pup"></span></div></div>
      <div class="h1">লগইন</div>
      <div class="sub">কর্জে হাসানা ফাউন্ডেশন</div>

      <div class="msg" id="loginMsg"></div>

      <div class="fg">
        <input id="lu" placeholder=" " autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('lp').focus()">
        <label>মোবাইল নম্বর বা ই-মেইল</label>
        <i class="ti ti-user li" aria-hidden="true"></i>
      </div>

      <div class="fg">
        <input id="lp" type="password" placeholder=" " autocomplete="current-password" onkeydown="capsCheck(event);if(event.key==='Enter')doLogin()">
        <label>পাসওয়ার্ড</label>
        <i class="ti ti-lock li" aria-hidden="true"></i>
        <button class="eb" type="button" onclick="tg('lp',this)" aria-label="পাসওয়ার্ড দেখান"><i class="ti ti-eye"></i></button>
      </div>
      <div class="caps" id="caps"><i class="ti ti-alert-triangle"></i> Caps Lock চালু আছে</div>

      <div class="ut">
        <label><input type="checkbox" id="remember"> মনে রাখুন</label>
        <a onclick="doReset()">পাসওয়ার্ড ভুলে গেছেন?</a>
      </div>

      <button class="btn" id="loginBtn" onclick="doLogin()"><i class="ti ti-login"></i> প্রবেশ করুন</button>

      <div class="or">অথবা</div>
      <button class="guest" onclick="doGuest()"><i class="ti ti-eye-search"></i> গেস্ট হিসেবে ঘুরে দেখুন</button>

      <div class="alt">নিউ ইউজার? <a onclick="flipTo(1)">সাইন আপ</a></div>
    </div>

    <!-- ════════ SIGN UP ════════ -->
    <div class="face back">
      <div class="head" id="hB"><div class="eye"><span class="pup"></span></div><div class="eye"><span class="pup"></span></div></div>
      <div class="h1">সাইন আপ</div>
      <div class="sub">নতুন অ্যাকাউন্ট তৈরি করুন</div>

      <div class="msg" id="regMsg"></div>

      <div class="sect">আপনি কী কী? (একাধিক)</div>
      <div class="chips">
        <button class="chip on" type="button" data-role="depositor" onclick="tog(this)"><i class="ti ti-pig-money ico"></i><i class="ti ti-check tick"></i>আমানতকারী</button>
        <button class="chip" type="button" data-role="borrower" onclick="tog(this)"><i class="ti ti-wallet ico"></i><i class="ti ti-check tick"></i>ঋণগ্রহীতা</button>
        <button class="chip" type="button" data-role="donor" onclick="tog(this)"><i class="ti ti-heart ico"></i><i class="ti ti-check tick"></i>দাতা সদস্য</button>
      </div>

      <div class="sect">তথ্য</div>
      <div class="fg">
        <input id="sn" placeholder=" " autocomplete="name">
        <label>পূর্ণ নাম</label>
        <i class="ti ti-id-badge-2 li" aria-hidden="true"></i>
      </div>
      <div class="fg">
        <input id="sm" placeholder=" " inputmode="numeric" autocomplete="tel">
        <label>মোবাইল নম্বর</label>
        <i class="ti ti-phone li" aria-hidden="true"></i>
      </div>
      <div class="fg">
        <input id="se" placeholder=" " type="email" autocomplete="email">
        <label>ই-মেইল (যাচাই হবে)</label>
        <i class="ti ti-mail li" aria-hidden="true"></i>
      </div>
      <div class="fg">
        <input id="sp" type="password" placeholder=" " autocomplete="new-password" oninput="pwMeter()">
        <label>পাসওয়ার্ড</label>
        <i class="ti ti-lock li" aria-hidden="true"></i>
        <button class="eb" type="button" onclick="tg('sp',this)" aria-label="পাসওয়ার্ড দেখান"><i class="ti ti-eye"></i></button>
      </div>
      <div class="pwbar"><div class="pwfill" id="pf"></div></div>

      <button class="btn" id="regBtn" onclick="doSignup()"><i class="ti ti-user-plus"></i> অ্যাকাউন্ট তৈরি করুন</button>
      <div class="alt">অ্যাকাউন্ট আছে? <a onclick="flipTo(0)">লগইন</a></div>
    </div>

  </div>
 </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   Interaction: spotlight, tilt, eyes
   ══════════════════════════════════════════════════════════ */
(function () {
  var spot = document.getElementById('spot');
  var flip = document.getElementById('flip');
  var tilt = document.getElementById('tilt');
  var heads = [document.getElementById('hA'), document.getElementById('hB')];
  var faces = document.querySelectorAll('.face');
  var flipped = 0;
  var small = window.matchMedia('(max-width:640px)').matches;

  window.__setFlipped = function (v) { flipped = v ? 1 : 0; };
  window.__flipped = function () { return flipped; };

  if (!small) {
    document.addEventListener('pointermove', function (ev) {
      if (ev.pointerType === 'touch') return;
      spot.style.transform = 'translate(' + ev.clientX + 'px,' + ev.clientY + 'px)';
      spot.classList.add('lit');

      faces.forEach(function (f) {
        var r = f.getBoundingClientRect();
        if (!r.width) return;
        f.style.setProperty('--mx', ((ev.clientX - r.left) / r.width * 100).toFixed(1) + '%');
        f.style.setProperty('--my', ((ev.clientY - r.top) / r.height * 100).toFixed(1) + '%');
      });

      var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      var ry = ((ev.clientX - cx) / cx) * 6, rx = -((ev.clientY - cy) / cy) * 6;
      tilt.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';

      heads.forEach(function (h) {
        if (!h || h.classList.contains('shut')) return;
        var hr = h.getBoundingClientRect();
        if (!hr.width) return;
        var hx = hr.left + hr.width / 2, hy = hr.top + hr.height / 2;
        var a = Math.atan2(ev.clientY - hy, ev.clientX - hx);
        var d = Math.min(3.6, Math.hypot(ev.clientX - hx, ev.clientY - hy) / 40);
        var tx = (Math.cos(a) * d).toFixed(1), ty = (Math.sin(a) * d).toFixed(1);
        h.querySelectorAll('.pup').forEach(function (p) { p.style.transform = 'translate(' + tx + 'px,' + ty + 'px)'; });
      });
    }, { passive: true });
  }

  document.addEventListener('focusin', function (e) {
    if (e.target.type === 'password') heads.forEach(function (h) { h.classList.add('shut'); });
  });
  document.addEventListener('focusout', function (e) {
    if (e.target.type === 'password') heads.forEach(function (h) { h.classList.remove('shut'); });
  });
})();

/* ── keep the card exactly as tall as whichever face is showing ── */
function syncFlipHeight() {
  var flip = document.getElementById('flip');
  if (!flip) return;
  var face = flip.querySelector(flip.classList.contains('reg') ? '.back' : '.front');
  if (!face) return;
  var h = face.offsetHeight;
  if (!h) return;
  /* only write when it actually changed, otherwise the MutationObserver
     below would keep re-triggering itself */
  var cur = parseFloat(flip.style.height) || 0;
  if (Math.abs(cur - h) > 0.5) flip.style.height = h + 'px';
}

function flipTo(on) {
  var f = document.getElementById('flip');
  window.__setFlipped(on);
  f.classList.toggle('reg', !!on);
  f.style.transform = 'rotateY(' + (on ? 180 : 0) + 'deg)';
  syncFlipHeight();
}

/* re-measure whenever anything changes the content height */
(function () {
  var run = function () { syncFlipHeight(); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
  window.addEventListener('load', run);
  window.addEventListener('resize', run);
  setTimeout(run, 60);
  setTimeout(run, 400);      // after webfonts settle
  setTimeout(run, 1200);

  if (window.ResizeObserver) {
    var ro = new ResizeObserver(run);
    document.querySelectorAll('.face').forEach(function (f) { ro.observe(f); });
  }
  var flip = document.getElementById('flip');
  if (window.MutationObserver && flip) {
    new MutationObserver(run).observe(flip, {
      childList: true, subtree: true, characterData: true, attributes: true,
      attributeFilter: ['class', 'style']
    });
  }
})();
function tog(b) { b.classList.toggle('on'); }
function tg(id, btn) {
  var p = document.getElementById(id), i = btn.querySelector('i'), s = p.type === 'password';
  p.type = s ? 'text' : 'password';
  i.className = s ? 'ti ti-eye-off' : 'ti ti-eye';
  document.querySelectorAll('.head').forEach(function (h) { h.classList.toggle('shut', !s && document.activeElement === p); });
  p.focus();
}
function capsCheck(e) {
  var on = e.getModifierState && e.getModifierState('CapsLock');
  document.getElementById('caps').classList.toggle('on', !!on);
}
function pwMeter() {
  var v = document.getElementById('sp').value, n = 0;
  if (v.length >= 8) n++;
  if (/[A-Z]/.test(v)) n++;
  if (/[a-z]/.test(v)) n++;
  if (/[0-9]/.test(v)) n++;
  if (/[^A-Za-z0-9]/.test(v)) n++;
  var f = document.getElementById('pf');
  f.style.width = v ? Math.round(n / 5 * 100) + '%' : '0';
  f.style.background = n <= 2 ? '#ef4444' : (n <= 4 ? '#f59e0b' : '#22c55e');
  return n;
}

/* ══════════════════════════════════════════════════════════
   Helpers
   ══════════════════════════════════════════════════════════ */
var ALIAS_DOMAIN = 'user.korjehasana.org';   // internal alias for mobile-only accounts

function msg(id, text, kind) {
  var el = document.getElementById(id);
  if (!text) { el.className = 'msg'; el.textContent = ''; return; }
  el.textContent = text;
  el.className = 'msg ' + (kind || 'err');
}
function shake() {
  var f = document.querySelector('.flip');
  f.classList.add('shake');
  setTimeout(function () { f.classList.remove('shake'); }, 460);
}
function busy(id, on, label) {
  var b = document.getElementById(id);
  b.disabled = on;
  b.innerHTML = on
    ? '<i class="ti ti-loader-2 spin"></i> ' + label
    : b.dataset.orig;
}
['loginBtn', 'regBtn'].forEach(function (id) {
  var b = document.getElementById(id);
  if (b) b.dataset.orig = b.innerHTML;
});

function normMobile(v) {
  var d = String(v || '').replace(/\D/g, '');
  if (d.length === 11 && d[0] === '0') return d;          // 01711515952
  if (d.length === 13 && d.indexOf('880') === 0) return '0' + d.slice(3);
  return d;
}
function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim()); }

/* a mobile number becomes 01711515952@user.korjehasana.org inside Supabase */
function toAuthEmail(idOrMobile) {
  var v = String(idOrMobile || '').trim();
  if (isEmail(v)) return v.toLowerCase();
  var m = normMobile(v);
  return m ? m + '@' + ALIAS_DOMAIN : '';
}

/* ══════════════════════════════════════════════════════════
   Login
   ══════════════════════════════════════════════════════════ */
async function doLogin() {
  var raw  = document.getElementById('lu').value.trim();
  var pass = document.getElementById('lp').value;
  msg('loginMsg', '');

  if (!raw)  { msg('loginMsg', 'মোবাইল নম্বর বা ই-মেইল দিন।'); shake(); return; }
  if (!pass) { msg('loginMsg', 'পাসওয়ার্ড দিন।'); shake(); return; }

  var email = toAuthEmail(raw);
  if (!email) { msg('loginMsg', 'সঠিক মোবাইল নম্বর বা ই-মেইল দিন।'); shake(); return; }

  busy('loginBtn', true, 'যাচাই করা হচ্ছে…');

  try {
    var res = await _db.auth.signInWithPassword({ email: email, password: pass });

    /* if the mobile alias failed, the number may be registered with a real email */
    if (res.error && !isEmail(raw)) {
      msg('loginMsg', 'এই মোবাইল নম্বরে অ্যাকাউন্ট পাওয়া যায়নি। ই-মেইল দিয়ে চেষ্টা করুন অথবা সাইন আপ করুন।');
      busy('loginBtn', false); shake(); return;
    }
    if (res.error) {
      msg('loginMsg', 'ভুল তথ্য। আবার চেষ্টা করুন।');
      busy('loginBtn', false); shake(); return;
    }

    try { await _db.rpc('touch_my_login'); } catch (e) {}

    var p = await _db.rpc('get_my_profile');
    var prof = p && p.data ? p.data : null;

    msg('loginMsg', 'স্বাগতম' + (prof && prof.full_name ? ', ' + prof.full_name : '') + '! নিয়ে যাচ্ছি…', 'ok');
    setTimeout(function () { route(prof); }, 800);

  } catch (err) {
    msg('loginMsg', 'সংযোগ ত্রুটি। আবার চেষ্টা করুন।');
    busy('loginBtn', false); shake();
  }
}

/* Work out where a member belongs.
   Returns a URL, or null when there is nowhere specific to send them —
   in that case the caller must NOT redirect. */
function destinationFor(prof) {
  if (!prof || !prof.id) return null;

  try {
    sessionStorage.setItem('kh_user', JSON.stringify({
      name: prof.full_name, code: prof.user_code,
      depositor: prof.is_depositor, borrower: prof.is_borrower, donor: prof.is_donor
    }));
  } catch (e) {}

  /* সবাই আগে নিজের ব্যক্তিগত ড্যাশবোর্ডে যায় */
  return 'my-dashboard.html';
}

/* used after a deliberate login/signup — always lands somewhere */
function route(prof) {
  location.href = destinationFor(prof) || 'my-dashboard.html';
}

/* ══════════════════════════════════════════════════════════
   Sign up
   ══════════════════════════════════════════════════════════ */
async function doSignup() {
  var name   = document.getElementById('sn').value.trim();
  var mobile = normMobile(document.getElementById('sm').value);
  var email  = document.getElementById('se').value.trim().toLowerCase();
  var pass   = document.getElementById('sp').value;
  msg('regMsg', '');

  if (!name)                { msg('regMsg', 'আপনার পূর্ণ নাম লিখুন।'); shake(); return; }
  if (mobile.length !== 11) { msg('regMsg', 'সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন (যেমন 01711515952)।'); shake(); return; }
  if (!isEmail(email))      { msg('regMsg', 'যাচাইয়ের জন্য একটি সঠিক ই-মেইল ঠিকানা দিন।'); shake(); return; }
  if (pass.length < 8)      { msg('regMsg', 'পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।'); shake(); return; }
  if (pwMeter() <= 2)       { msg('regMsg', 'পাসওয়ার্ডটি দুর্বল। বড় হাতের অক্ষর, সংখ্যা ও চিহ্ন যোগ করুন।'); shake(); return; }

  var roles = [].map.call(document.querySelectorAll('.chip.on'), function (c) { return c.dataset.role; });
  if (!roles.length) { msg('regMsg', 'অন্তত একটি ভূমিকা নির্বাচন করুন।'); shake(); return; }

  /* ── the member chooses how to verify ── */
  if (!(window.KHUI && KHUI.chooseVerify)) { emailStep(name, mobile, email, pass); return; }

  msg('regMsg', 'যাচাইয়ের মাধ্যম বেছে নিন।', 'info');
  KHUI.chooseVerify({
    onCancel: function () { msg('regMsg', 'অ্যাকাউন্ট খুলতে যাচাই আবশ্যক।'); },
    onPick: function (method) {
      if (method === 'email') emailStep(name, mobile, email, pass);
      /* 'sms' is shown as "coming soon" and cannot be picked yet */
    }
  });
}

/* ── real email OTP via Supabase (free) ── */
async function emailStep(name, mobile, email, pass) {
  msg('regMsg', 'ই-মেইলে পাঠানো কোডটি যাচাই করুন।', 'info');
  busy('regBtn', true, 'ই-মেইল কোড পাঠানো হচ্ছে…');

  var sent = await _db.auth.signInWithOtp({
    email: email,
    options: { shouldCreateUser: true }
  });
  busy('regBtn', false);
  if (sent.error) {
    msg('regMsg', 'ই-মেইল কোড পাঠানো যায়নি: ' + sent.error.message);
    shake(); return;
  }

  KHUI.otp({
    length: 6, demo: false,
    title: 'ই-মেইল যাচাই',
    subtitle: email + ' — এ পাঠানো ৬ সংখ্যার কোডটি লিখুন',
    onVerify: async function (code, done) {
      var v = await _db.auth.verifyOtp({ email: email, token: code, type: 'email' });
      done(!v.error && v.data && v.data.session);
    },
    onCancel: function () { msg('regMsg', 'ই-মেইল যাচাই না করলে অ্যাকাউন্ট সম্পূর্ণ হবে না।'); },
    onSuccess: function () { finishSignup(name, mobile, email, pass); }
  });
}

/* ── STEP 3 · both verified → set password + create profile ── */
async function finishSignup(name, mobile, email, pass) {
  busy('regBtn', true, 'অ্যাকাউন্ট তৈরি হচ্ছে…');
  try {
    /* the email OTP already signed us in; attach the chosen password */
    var upd = await _db.auth.updateUser({ password: pass });
    var sess = await _db.auth.getSession();
    var uid = sess && sess.data && sess.data.session ? sess.data.session.user.id : null;
    if (!uid) {
      msg('regMsg', 'যাচাই সম্পন্ন হয়নি। আবার চেষ্টা করুন।');
      busy('regBtn', false); shake(); return;
    }

    var pr = await _db.rpc('create_user_profile', {
      p_id: uid, p_full_name: name, p_mobile: mobile,
      p_email: email, p_nid: null, p_address: null, p_district: null
    });
    if (pr.error) { msg('regMsg', pr.error.message); busy('regBtn', false); shake(); return; }

    var prof = pr.data;
    msg('regMsg', 'স্বাগতম! মোবাইল ও ই-মেইল যাচাই সম্পন্ন। আপনার সদস্য আইডি: ' +
        (prof && prof.user_code ? prof.user_code : '—'), 'ok');
    setTimeout(function () { route(prof); }, 1500);
  } catch (err) {
    msg('regMsg', 'সংযোগ ত্রুটি। আবার চেষ্টা করুন।');
    busy('regBtn', false); shake();
  }
}

/* ══════════════════════════════════════════════════════════
   Password reset + guest
   ══════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════
   পাসওয়ার্ড ভুলে গেছেন — ই-মেইলে ৬ সংখ্যার কোড (ও লিংক)
   ══════════════════════════════════════════════════════════ */
async function doReset() {
  var raw = document.getElementById('lu').value.trim();

  if (!raw) {
    msg('loginMsg', 'উপরের ঘরে আপনার ই-মেইল ঠিকানা লিখে আবার চাপুন।', 'info');
    document.getElementById('lu').focus();
    return;
  }
  if (!isEmail(raw)) {
    msg('loginMsg', 'পাসওয়ার্ড রিসেট করতে ই-মেইল ঠিকানা লাগবে (মোবাইল নম্বরে হবে না)। ' +
                    'অ্যাকাউন্টে ই-মেইল না থাকলে যোগাযোগ করুন: ০১৭১১-৫১৫৯৫২', 'info');
    document.getElementById('lu').focus();
    return;
  }

  var email = raw.toLowerCase();
  msg('loginMsg', 'ই-মেইল পাঠানো হচ্ছে…', 'info');

  var r = await _db.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + '/reset-password.html'
  });
  if (r && r.error) {
    msg('loginMsg', 'পাঠানো যায়নি: ' + r.error.message, 'err');
    return;
  }

  msg('loginMsg', email + ' — এ ই-মেইল পাঠানো হয়েছে। কোড থাকলে নিচে লিখুন, ' +
                  'অথবা ই-মেইলের লিংকে ক্লিক করুন।', 'ok');

  /* ই-মেইলে ৬ সংখ্যার কোড এলে এখানেই যাচাই — নাহলে লিংকে ক্লিক করলেও চলবে */
  if (!(window.KHUI && KHUI.otp)) return;

  KHUI.otp({
    length: 6, demo: false,
    title: 'পাসওয়ার্ড রিসেট',
    subtitle: email + ' — এ পাঠানো ৬ সংখ্যার কোডটি লিখুন। কোড না এলে ই-মেইলের লিংকে ক্লিক করুন।',
    onVerify: async function (code, done) {
      try {
        var v = await _db.auth.verifyOtp({ email: email, token: code, type: 'recovery' });
        done(!(v && v.error) && v.data && v.data.session);
      } catch (e) { done(false); }
    },
    onCancel: function () {
      msg('loginMsg', 'ই-মেইলে পাঠানো লিংকে ক্লিক করেও পাসওয়ার্ড বদলাতে পারবেন।', 'info');
    },
    onSuccess: function () {
      msg('loginMsg', 'যাচাই সম্পন্ন! নতুন পাসওয়ার্ড দেওয়ার পাতায় নিয়ে যাচ্ছি…', 'ok');
      setTimeout(function () { location.href = 'reset-password.html'; }, 700);
    }
  });
}

function doGuest() {
  sessionStorage.setItem('kh_guest', '1');
  location.href = 'index.html';
}

/* ══════════════════════════════════════════════════════════
   Already signed in?
   Only leave this page when there is a definite destination.
   A stale session with no member profile must NOT bounce the
   visitor to the homepage — they stay here and can sign in
   as somebody else.
   ══════════════════════════════════════════════════════════ */
(async function () {
  if (location.search.indexOf('stay=1') !== -1) return;   // escape hatch

  /* ড্যাশবোর্ড আমাদের ফেরত পাঠিয়েছে? তবে আর সেখানে পাঠাবো না —
     নাহলে দুই পেজ একে অন্যকে পাঠাতে থাকবে (রিডাইরেক্ট লুপ) */
  var bounced = false;
  try { bounced = !!sessionStorage.getItem('kh_dash_bounce'); } catch (e) {}

  try {
    var s = await _db.auth.getSession();
    if (!s || !s.data || !s.data.session) return;         // nobody signed in

    var p = await _db.rpc('get_my_profile');
    var prof = (p && !p.error) ? p.data : null;
    var dest = destinationFor(prof);

    if (bounced) {
      msg('loginMsg',
          'ড্যাশবোর্ড খুলতে সমস্যা হয়েছিল। নিচে সাইন আউট করে আবার লগইন করুন।', 'info');
      showSignOut();
      return;
    }

    if (dest) { location.replace(dest); return; }

    /* signed in, but no member profile / no role → stay put and explain */
    msg('loginMsg',
        'আপনি ইতিমধ্যে সাইন ইন করা আছেন, তবে এখনো কোনো সদস্য প্রোফাইল যুক্ত হয়নি। ' +
        'নতুন অ্যাকাউন্ট খুলুন অথবা অন্য পরিচয়ে লগইন করুন।', 'info');
    showSignOut();
  } catch (e) { /* offline or RPC missing — just show the form */ }
})();

/* offer a way out of a stale session */
function showSignOut() {
  if (document.getElementById('signOutRow')) return;
  var row = document.createElement('div');
  row.id = 'signOutRow';
  row.className = 'alt';
  row.innerHTML = 'অন্য অ্যাকাউন্টে ঢুকতে চান? <a id="soLink">সাইন আউট করুন</a>';
  var alt = document.querySelector('.front .alt');
  alt.parentNode.insertBefore(row, alt);
  document.getElementById('soLink').onclick = async function () {
    await _db.auth.signOut();
    try { sessionStorage.clear(); } catch (e) {}   /* bounce গার্ড ও ক্যাশ পরিষ্কার */
    msg('loginMsg', 'সাইন আউট হয়েছে। এখন লগইন করুন।', 'ok');
    row.remove();
  };
}
